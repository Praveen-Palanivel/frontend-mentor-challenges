<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Social links profile</title>
</head>

<body>

  <div class="container">
    
    <div class="avatar">
      <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica">
    </div>
  
    <h2 class="name">Jessica Randall</h2>

    <h5 class="location">London, United Kingdom</h5>
  
    <p class="content">"Front-end developer and avid reader."</p>

    <div class="buttons">
      <button class="github" type="button">GitHub</button>
      <button class="frontend mentor" type="button">Frontend Mentor</button>
      <button class="linkedin" type="button">LinkedIn</button>
      <button class="twitter" type="button">Twitter</button>
      <button class="instagram" type="button">Instagram</button>
    </div>

  </div>
  
</body>
</html>
